<div
  class="modal-backdrop"
  tabindex="0"
  role="button"
  aria-label="Close submitted pre-order dialog"
  (click)="closeModal()"
  (keydown.enter)="closeModal()"
  (keydown.space)="closeModal(); $event.preventDefault()"
>
  <div
    class="modal-container"
    role="dialog"
    aria-modal="true"
    aria-labelledby="submitted-order-title"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h2 id="submitted-order-title">Pre-Order Submitted</h2>

      <button
        type="button"
        class="icon-button icon-button--small close-button"
        aria-label="Close dialog"
        (click)="closeModal()"
      >
        <img src="assets/svg/close.svg" alt="" aria-hidden="true" />
      </button>
    </div>

    <div class="text">
      <p class="body">Your Pre-Order was sent successfully.</p>
      <p class="body">Wait for the confirmation from the restaurant.</p>
    </div>

    <button type="button" class="view-button" (click)="viewReservations()">
      View Reservations
    </button>
  </div>
</div>
